---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: work-os
description: Work Fedora Kinoite image.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  - from-file: profiles/de/kde.yml
  - from-file: profiles/shell.yml
  - from-file: profiles/dev.yml
  - from-file: profiles/system.yml
  - from-file: profiles/browsers.yml
  - from-file: profiles/secrets.yml
  - from-file: profiles/vpn.yml
  - from-file: profiles/codecs.yml
  - from-file: profiles/media-playback.yml
  - from-file: profiles/chat.yml
  - from-file: profiles/work.yml
  - type: signing
