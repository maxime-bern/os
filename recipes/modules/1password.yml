---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # 1Password is not in Fedora; it ships a .repo file and a key instead.
  - type: dnf
    repos:
      files:
        - 1password.repo
      keys:
        - https://downloads.1password.com/linux/keys/1password.asc
    install:
      packages:
        - 1password
        - 1password-cli
  - type: files
    files:
      - source: system/etc/1password
        destination: /etc/1password
      - source: system/usr/lib/sysusers.d/1password.conf
        destination: /usr/lib/sysusers.d/1password.conf
  # The browser-support and CLI binaries are setgid to the groups the sysusers
  # drop-in above declares.
  - type: script
    scripts:
      - 1password-groups.sh
