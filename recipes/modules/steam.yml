---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
type: dnf
repos:
  # Steam comes from the same Terra repo as the rest of the desktop.
  files:
    - terra.repo
  keys:
    - https://repos.fyralabs.com/terra%OS_VERSION%/key.asc
install:
  packages:
    - steam
    # 32-bit runtime for Steam.
    - vulkan-loader.i686
