---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # greetd and noctalia-greeter are not in Fedora, they come from the community
  # Terra repo. Both the repo file and the key are build-time only.
  - type: dnf
    repos:
      files:
        - terra.repo
      keys:
        - https://repos.fyralabs.com/terra%OS_VERSION%/key.asc
    install:
      packages:
        - greetd
        - noctalia-greeter
  # greetd ships a config running agreety; replace it with the Noctalia greeter
  # wrapper, and keep /var/lib/noctalia-greeter across rebases through tmpfiles.
  - type: files
    files:
      - source: greeter
        destination: /
  - type: systemd
    system:
      enabled:
        - greetd.service
