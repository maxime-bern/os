---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # L2TP/IPsec for the Infostrates VPN; libreswan is only a weak dep; go-l2tp
  # fills the L2TP daemon (no xl2tpd on F44).
  - type: dnf
    install:
      packages:
        - NetworkManager-l2tp
        - libreswan
  # libreswan 5 drops IKEv1 by default, which L2TP/IPsec needs.
  - type: files
    files:
      - source: system/etc/ipsec.conf
        destination: /etc/ipsec.conf
