---
type: dnf
install:
  exclude:
    - brightnessctl
    - fuzzel
    - playerctl
    - swaylock
    - waybar
  packages:
    - 1password
    - 1password-cli
    - accountsservice
    - ghostty
    - dbus
    - gnome-keyring
    - greetd
    - gstreamer1-plugin-openh264
    - gstreamer1-plugins-bad-freeworld
    - gstreamer1-plugins-ugly
    - libavcodec-freeworld
    - libva-utils
    - nautilus
    - niri
    - noctalia
    - obs-studio
    - polkit
    - systemd-pam
    - xdg-desktop-portal-gnome
    - xwayland-satellite
    - zen-browser
replace:
  - from-repo: fedora-cisco-openh264
    packages:
      - old: noopenh264
        new: mozilla-openh264
