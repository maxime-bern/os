---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    remove:
      packages:
        - fzf
    install:
      packages:
        - zoxide
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
  # zsh for newly created users.
  - type: script
    scripts:
      - default-shell.sh
