---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
type: dnf
repos:
  # Ghostty is not in Fedora.
  copr:
    - scottames/ghostty
install:
  # Terra's stale ghostty subpackages would be pulled in as weak deps and
  # collide with the files the Copr build now ships itself.
  install-weak-deps: false
  packages:
    - ghostty
