---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Docker CE comes from Docker's repo, declared by its published .repo file.
  - type: dnf
    repos:
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      packages:
        - containerd.io
        - distrobox
        - docker-buildx-plugin
        - docker-ce
        - docker-ce-cli
        - docker-compose-plugin
  - type: files
    files:
      - source: system/usr/lib/sysusers.d/docker.conf
        destination: /usr/lib/sysusers.d/docker.conf
  - type: systemd
    system:
      enabled:
        - docker.service
